# docker-compose.yml
version: '3.8'

services:
  # Сервис базы данных
  db:
    image: postgres:15-alpine
    container_name: catty-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432" # Проброс порта наружу для отладки
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # Сервис приложения (бекенд), будет запущен в 3 экземплярах
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
    volumes:
      # Монтируем код для разработки (удобно, но в проде лучше не надо)
      - ./app:/app/app
    # Проброс портов не нужен, так как общаться будут через внутреннюю сеть с nginx
    networks:
      - app-network

  # Сервис веб-сервера и балансировщика
  nginx:
    image: nginx:alpine
    container_name: catty-nginx
    volumes:
      # Монтируем конфиг nginx (его нужно создать отдельно)
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8181:80" # Пробрасываем порт 8181 хоста на порт 80 контейнера nginx
    depends_on:
      - app
    networks:
      - app-network

# Определяем сети и тома
networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
    name: catty-postgres-data
