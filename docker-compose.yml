services:
  db:
    image: postgres:15-alpine
    container_name: catty-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  app:
    # ВАЖНО: указываем image из GHCR
    image: ghcr.io/maeosha/catty-reminders-app/app:latest
    ports:
         - "8181:8181"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
    # Для продакшена - не монтируем код поверх образа!
    # volumes:
    #   - ./app:/app/app
    networks:
      - app-network
    # Добавим проверку здоровья
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8181/ || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 3

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
    name: catty-postgres-data
